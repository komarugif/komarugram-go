# The module pkg/ratex embeds: RaTeX's parser and layout behind a few
# functions of a WebAssembly reactor. See build.sh.
[package]
name = "komarugram-ratex"
version = "0.1.0"
edition = "2021"
license = "Unlicense OR MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# RaTeX (https://github.com/erweixin/RaTeX, MIT) at a pinned commit.
ratex-parser = { git = "https://github.com/erweixin/RaTeX", rev = "776c1d37bafa3bf445a0ab9377c55fe77f7a0133" }
ratex-layout = { git = "https://github.com/erweixin/RaTeX", rev = "776c1d37bafa3bf445a0ab9377c55fe77f7a0133" }
ratex-types = { git = "https://github.com/erweixin/RaTeX", rev = "776c1d37bafa3bf445a0ab9377c55fe77f7a0133" }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
# "z" compiles in 0.54 s instead of 1.36 s, 654 KB gzipped instead of 858,
# and lays the formulas of messages out 10 % slower: 0.18 ms each.
opt-level = "z"
strip = true
